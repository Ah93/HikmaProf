<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 960px; height: 540px; margin: 0; padding: 0;
      font-family: {{fontFamily}};
      background-color: {{backgroundColor}};
      display: flex; flex-direction: column;
    }
    .title-zone { padding: 24px 40px 16px; }
    h1 { font-size: 36px; color: {{primaryColor}}; margin: 0; font-weight: bold; }
    .content-zone { flex: 1; padding: 16px 40px; overflow: hidden; }
    .takeaways {
      list-style: none; padding: 0; margin: 0;
    }
    .takeaways li {
      font-size: 22px; color: #333;
      margin-bottom: 18px; padding-left: 30px;
      position: relative; line-height: 1.4;
    }
    .takeaways li::before {
      content: "✓"; color: {{accentColor}};
      font-size: 28px; position: absolute;
      left: 0; top: -4px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="title-zone"><h1>{{title}}</h1></div>
  <div class="content-zone">
    <ul class="takeaways">
      {{#each keyTakeaways}}
      <li>{{this}}</li>
      {{/each}}
    </ul>
  </div>
</body>
</html>
