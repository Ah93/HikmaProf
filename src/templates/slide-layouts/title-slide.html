<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 960px; height: 540px; margin: 0;
      font-family: {{fontFamily}};
      background: linear-gradient(135deg, {{primaryColor}} 0%, {{secondaryColor}} 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white;
    }
    h1 { font-size: 48px; margin: 0 40px; text-align: center; }
    .subtitle { font-size: 24px; margin-top: 16px; opacity: 0.9; }
    .author { font-size: 18px; margin-top: 40px; opacity: 0.8; }
    .date { font-size: 16px; margin-top: 8px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>{{title}}</h1>
  {{#if subtitle}}<div class="subtitle">{{subtitle}}</div>{{/if}}
  {{#if author}}<div class="author">{{author}}</div>{{/if}}
  {{#if date}}<div class="date">{{date}}</div>{{/if}}
</body>
</html>
