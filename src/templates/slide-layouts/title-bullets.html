<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 960px;
      height: 540px;
      margin: 0;
      padding: 0;
      font-family: {{fontFamily}};
      background-color: {{backgroundColor}};
      display: flex;
      flex-direction: column;
    }
    .title-zone {
      width: 920px;
      margin: 0 20px;
      padding-top: 24px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 36px;
      color: {{primaryColor}};
      margin: 0;
      font-weight: bold;
    }
    .content-zone {
      flex: 1;
      padding: 16px 40px;
      overflow: hidden;
    }
    .bullets {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .bullets li {
      font-size: 20px;
      color: #333;
      margin-bottom: 14px;
      padding-left: 24px;
      position: relative;
      line-height: 1.4;
    }
    .bullets li::before {
      content: "•";
      color: {{accentColor}};
      font-size: 24px;
      position: absolute;
      left: 0;
      top: -2px;
    }
    .footnote-zone {
      padding: 8px 20px;
      flex-shrink: 0;
    }
    .footnote {
      font-size: 10px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="title-zone">
    <h1>{{title}}</h1>
  </div>

  <div class="content-zone">
    <ul class="bullets">
      {{#each bullets}}
      <li>{{this.text}}</li>
      {{/each}}
    </ul>
  </div>

  {{#if footnote}}
  <div class="footnote-zone">
    <p class="footnote">{{footnote}}</p>
  </div>
  {{/if}}
</body>
</html>
